  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // -----------------------------------------------------------
    // OneDrive / Graph: Daten aus Personal.txt + Excel laden
    // -----------------------------------------------------------
const msalConfig = {
  auth: {
    clientId: "efc76603-8876-48b3-a942-83f27694e4e6",
    authority: "https://login.microsoftonline.com/f54f53bb-d0ff-4b78-bcf4-4aeeeb924428", // <-- ohne /v2.0 + richtige Tenant-ID
    redirectUri: "https://thiemann423.github.io/Schl-ssausgabe/", // exakt wie in Azure (inkl. Slash am Ende)
  },
  cache: {
    cacheLocation: "sessionStorage",
    storeAuthStateInCookie: false,
  },
};

const loginRequest = {
  scopes: ["User.Read", "Files.ReadWrite"],
};


const msalInstance = new msal.PublicClientApplication(msalConfig);
const msalReady = msalInstance.initialize();



async function getGraphClient() {
  await msalReady;

  let account = msalInstance.getActiveAccount();
  if (!account) {
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) account = accounts[0];
  }

  if (!account) {
    const loginResult = await msalInstance.loginPopup(loginRequest);
    account = loginResult.account;
  }

  msalInstance.setActiveAccount(account);

  let tokenResponse;
  try {
    tokenResponse = await msalInstance.acquireTokenSilent({
      ...loginRequest,
      account,
    });
  } catch (e) {
    tokenResponse = await msalInstance.acquireTokenPopup(loginRequest);
  }

  const accessToken = tokenResponse.accessToken;

  const graphClient = {
    async get(url, responseType = "json") {
      const res = await fetch("https://graph.microsoft.com/v1.0" + url, {
        headers: { Authorization: "Bearer " + accessToken },
      });
      if (!res.ok) {
        throw new Error("Graph GET " + res.status + ": " + (await res.text()));
      }

      if (responseType === "arraybuffer") return res.arrayBuffer();
      if (responseType === "text") return res.text();
      return res.json();
    },

    async put(url, body, contentType) {
      const res = await fetch("https://graph.microsoft.com/v1.0" + url, {
        method: "PUT",
        headers: {
          Authorization: "Bearer " + accessToken,
          "Content-Type": contentType,
        },
        body,
      });

      if (!res.ok) {
        throw new Error("Graph PUT " + res.status + ": " + (await res.text()));
      }
      return res.json();
    },

    // optional (falls ihr Ordner/Datei-Metadaten anlegen wollt)
    async post(url, jsonBody) {
      const res = await fetch("https://graph.microsoft.com/v1.0" + url, {
        method: "POST",
        headers: {
          Authorization: "Bearer " + accessToken,
          "Content-Type": "application/json",
        },
        body: JSON.stringify(jsonBody),
      });

      if (!res.ok) {
        throw new Error("Graph POST " + res.status + ": " + (await res.text()));
      }
      return res.json();
    },
  };

  return { graphClient, account };
}
function mergeIssuesById(prevIssues, updatedJsonIssues) {
  const map = new Map();

  const makeFallbackId = (i) => {
    if (i?.id !== undefined && i?.id !== null && String(i.id).trim() !== "") {
      return String(i.id); // ✅ IMMER String
    }
    return `${i.personnelNumber || ""}_${i.issueDate || ""}_${i.system || ""}`;
  };

  (prevIssues || []).forEach((i) => {
    const id = makeFallbackId(i);
    map.set(id, { ...i, id });
  });

  (updatedJsonIssues || []).forEach((i) => {
    const id = makeFallbackId(i);
    map.set(id, { ...map.get(id), ...i, id });
  });

  return Array.from(map.values());
}


// optional helper – ok so
function encodePath(p) {
  return p.split("/").map(encodeURIComponent).join("/");
}

    function oneDrivePdfContentUrl(folder, fileName) {
  if (!fileName) return null;
  return `https://graph.microsoft.com/v1.0/me/drive/root:/${encodeURIComponent(folder)}/${encodeURIComponent(fileName)}:/content`;
}

async function findItemByName(graphClient, fileName) {
  const q = encodeURIComponent(fileName);
  const res = await graphClient.get(`/me/drive/root/search(q='${q}')`);
  const hit = res?.value?.[0];
  if (!hit) throw new Error(`Datei nicht gefunden: ${fileName} (Drive search)`);
  return hit;
}


async function getOrCreatePersonalTxt(graphClient) {
  try {
    const item = await findItemByName(graphClient, "Personal.txt");
    const text = await graphClient.get(`/me/drive/items/${item.id}/content`, "text");
    return { id: item.id, text };
  } catch {
    // Datei existiert noch nicht → neu anlegen
    const empty = "";
    const res = await graphClient.put(
      `/me/drive/root:/Personal.txt:/content`,
      empty,
      "text/plain"
    );
    return { id: res.id, text: "" };
  }
}




async function loadEmployeesFromPersonalTxt(graphClient) {
  // Datei im OneDrive finden (egal in welchem Unterordner)
  const item = await findItemByName(graphClient, "Personal.txt");

  // Inhalt der Datei laden
  const content = await graphClient.get(
    `/me/drive/items/${item.id}/content`,
    "text"
  );

  const lines = content.split(/\r?\n/);
  const employees = [];
  let idCounter = 1;

  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;

    const parts = trimmed.split(";");
    if (parts.length < 2) continue;

    employees.push({
      employeeId: "e" + idCounter++,
      personnelNumber: parts[0].trim(),
      fullName: parts[1].trim(),
      department: null,
    });
  }

  return employees;
}
function normalizePn(pn) {
  return String(pn || "").trim();
}
function normalizeName(name) {
  return String(name || "").trim();
}

function parsePersonalTxt(contentText) {
  const lines = String(contentText || "").split(/\r?\n/);
  const items = [];
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    const parts = trimmed.split(";");
    if (parts.length < 2) continue;
    items.push({
      personnelNumber: normalizePn(parts[0]),
      fullName: normalizeName(parts[1]),
    });
  }
  return items;
}

function buildPersonalTxt(items) {
  // Sauber + stabil speichern
  return (items || [])
    .map((x) => `${normalizePn(x.personnelNumber)};${normalizeName(x.fullName)}`)
    .join("\n") + "\n";
}

// Lädt Personal.txt als "Item" + Inhalt
async function getPersonalTxtItemAndContent(graphClient) {
  const item = await findItemByName(graphClient, "Personal.txt");
  const content = await graphClient.get(`/me/drive/items/${item.id}/content`, "text");
  return { item, content };
}

// Speichert Personal.txt zurück (über item.id, ist am zuverlässigsten)
async function savePersonalTxtByItemId(graphClient, itemId, text) {
  await graphClient.put(
    `/me/drive/items/${itemId}/content`,
    new Blob([text], { type: "text/plain; charset=utf-8" }),
    "text/plain"
  );
}

// ✅ Fügt einen Mitarbeiter hinzu (mit Duplikat-Schutz)
async function appendEmployeeToPersonalTxt(graphClient, { personnelNumber, fullName }) {
  const pn = normalizePn(personnelNumber);
  const name = normalizeName(fullName);

  if (!pn || !name) throw new Error("Personalnummer und Name sind Pflicht.");

  const { item, content } = await getPersonalTxtItemAndContent(graphClient);
  const list = parsePersonalTxt(content);

  // Duplikate vermeiden (PN ist das stärkste Kriterium)
  if (list.some((x) => normalizePn(x.personnelNumber) === pn)) {
    throw new Error("Personalnummer existiert bereits in Personal.txt.");
  }

  // Anfügen + optional sortieren
  list.push({ personnelNumber: pn, fullName: name });
  // optional: sortiert nach Personalnummer
  list.sort((a, b) => String(a.personnelNumber).localeCompare(String(b.personnelNumber)));

  const newText = buildPersonalTxt(list);
  await savePersonalTxtByItemId(graphClient, item.id, newText);

  return list; // zurückgeben als “neuer Stand”
}


async function loadExcelIssues(graphClient) {
  // ✅ Excel-Datei per Drive-Suche finden (statt festen Pfad zu raten)
  const item = await findItemByName(graphClient, "Schlüssel Schließplan Verteilung Mitarbeiter.xlsx");

  const sheetName = "Tabelle1"; // laut deinem Screenshot / Datei

  // usedRange aus der gefundenen Datei holen
const rangeUrl =
  `/me/drive/items/${item.id}/workbook/worksheets('${sheetName}')/usedRange(valuesOnly=true)`;


  const json = await graphClient.get(rangeUrl, "json");

  const rows = json.values;
  if (!rows || rows.length === 0) return [];

const header = rows[0].map((h) => String(h || "").trim());
const dataRows = rows.slice(1);

// Normalisierung für robuste Excel-Header-Erkennung
const norm = (s) =>
  String(s || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ")
    .replace(/ä/g, "ae")
    .replace(/ö/g, "oe")
    .replace(/ü/g, "ue")
    .replace(/ß/g, "ss");

const headerNorm = header.map(norm);

const indexOfAny = (...candidates) => {
  const cand = candidates.map(norm);
  return headerNorm.findIndex((h) => cand.includes(h));
};

// 🔥 Hier deine neuen robusten Spalten-Zuordnungen
const idxAbteilung  = indexOfAny("Abteilung");
const idxPersonalnr = indexOfAny("Personalnummer", "Personalnr.", "PersNr", "PN");
const idxName       = indexOfAny("Name", "Mitarbeiter");
const idxSystem     = indexOfAny("Schließsystem", "Schliesssystem", "System");
const idxWeitere    = indexOfAny("weitere Schlüssel", "Weitere Schlüssel", "Bemerkung");
const idxDatum      = indexOfAny("Datum", "Ausgabedatum");
const idxRueckgabe  = indexOfAny("Rückgabe", "Rueckgabe", "Return");


const issues = [];

for (const row of dataRows) {
  if (!row || row.length === 0) continue;

  const value = (idx) =>
    idx >= 0 && idx < row.length && row[idx] != null && row[idx] !== ""
      ? String(row[idx]).trim()
      : null;

  const department = value(idxAbteilung);
  const pnRaw = value(idxPersonalnr);
  const name = value(idxName);
  const system = value(idxSystem);
  const otherKeys = value(idxWeitere);
  const dateVal = value(idxDatum);
  const rueckgabe = value(idxRueckgabe);

  const issueDate = excelSerialToIsoDate(dateVal);

  const hasReturn = !!(rueckgabe && String(rueckgabe).trim());

  const returnInfo = rueckgabe || null;

  let personnelNumber = pnRaw;
  if (pnRaw && /^\d+\.0$/.test(pnRaw)) {
    personnelNumber = String(parseInt(pnRaw, 10));
  }

  // ✅ STABILE ID aus Inhalt (damit Rückgabe auch bei alten Excel-Daten klappt)
  const stableId = `${personnelNumber || ""}_${issueDate || ""}_${system || ""}`;

issues.push({
  id: stableId,               // ← sehr wichtig: stabiler Schlüssel
  employeeName: name,
  personnelNumber,
  department,
  system,
  otherKeys,
  issueDate,

  // Excel-Status
  hasReturn: hasReturn,       // Excel-Rückgabe vorhanden?
  returnInfo: returnInfo || null,

  // ⛔ Excel hat KEIN Rückgabe-PDF → das ist Altbestand
  returnPdfFileName: null,
  returnPdfWebUrl: null,

  // Ausgabe-PDF gibt es bei Excel ebenfalls nicht
  pdfFileName: null,
  pdfWebUrl: null,
});

}

return issues;
}

function excelSerialToIsoDate(v) {
  if (!v) return null;

  // Wenn es schon ein normales Datum ist → so lassen
  if (typeof v === "string" && v.includes("-")) return v;

  const num = Number(v);
  if (!isFinite(num)) return String(v);

  // Excel epoch: 1899-12-30
  const excelEpoch = new Date(Date.UTC(1899, 11, 30));
  const ms = num * 24 * 60 * 60 * 1000;
  const d = new Date(excelEpoch.getTime() + ms);

  return d.toISOString().slice(0, 10); // YYYY-MM-DD
}

function formatDateDE(d) {
  if (!d) return "–";
  const dt = new Date(d);
  if (isNaN(dt)) return String(d);
  return dt.toLocaleDateString("de-DE");
}


    function buildKeysFromIssues(issues) {
      const systems = new Set();
      for (const i of issues) {
        if (i.system) systems.add(i.system);
      }
      const keys = [];
      let idx = 1;
      for (const sys of Array.from(systems).sort()) {
        keys.push({
          keyId: "k" + idx++,
          system: sys,
          number: "",
          description: sys,
        });
      }
      return keys;
    }

    function mergeEmployees(employees, issues) {
      const byPn = new Map();
      const byName = new Map();

      for (const emp of employees) {
        if (emp.personnelNumber) byPn.set(emp.personnelNumber, emp);
        if (emp.fullName) byName.set(emp.fullName.toLowerCase(), emp);
      }

      for (const issue of issues) {
        const name = issue.employeeName;
        const pn = issue.personnelNumber;
        const dept = issue.department;

        let emp = null;
        if (pn && byPn.has(pn)) emp = byPn.get(pn);
        else if (name && byName.has(name.toLowerCase())) emp = byName.get(name.toLowerCase());

        if (!emp && (name || pn)) {
          emp = {
            employeeId: "e" + (employees.length + 1),
            personnelNumber: pn || null,
            fullName: name || null,
            department: dept || null,
          };
          employees.push(emp);
        }

        if (emp) {
          if (emp.personnelNumber && !byPn.has(emp.personnelNumber))
            byPn.set(emp.personnelNumber, emp);
          if (emp.fullName && !byName.has(emp.fullName.toLowerCase()))
            byName.set(emp.fullName.toLowerCase(), emp);
          if (dept && !emp.department) emp.department = dept;
        }
      }
      return employees;
    }

(issuesFromExcel || []).forEach((i) => {

    function SignaturePad({ value, onChange, label, role }) {
      const canvasRef = useRef(null);
      const drawing = useRef(false);
      const lastPos = useRef({ x: 0, y: 0 });

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const resize = () => {
          const rect = canvas.getBoundingClientRect();
          const imageData = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
          canvas.width = rect.width;
          canvas.height = 140;
          canvas.getContext("2d").putImageData(imageData, 0, 0);
        };

        resize();
        window.addEventListener("resize", resize);
        return () => window.removeEventListener("resize", resize);
      }, []);

      const getPos = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        if (e.touches && e.touches.length > 0) {
          return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top,
          };
        } else {
          return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top,
          };
        }
      };

      const startDrawing = (e) => {
        e.preventDefault();
        drawing.current = true;
        lastPos.current = getPos(e);
      };

      const draw = (e) => {
        if (!drawing.current) return;
        e.preventDefault();
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d");
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#111827";

        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastPos.current.x, lastPos.current.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        lastPos.current = pos;
      };

      const stopDrawing = () => {
        if (!drawing.current) return;
        drawing.current = false;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const dataUrl = canvas.toDataURL("image/png");
        onChange && onChange(dataUrl);
      };

      const handleClear = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        onChange && onChange(null);
      };

      return (
        <div className="signature-card">
          <div className="signature-name">{label}</div>
          <div className="signature-role">{role}</div>
          <div className="signature-canvas-wrapper">
            <canvas
              ref={canvasRef}
              className="signature-canvas"
              onMouseDown={startDrawing}
              onMouseMove={draw}
              onMouseUp={stopDrawing}
              onMouseLeave={stopDrawing}
              onTouchStart={startDrawing}
              onTouchMove={draw}
              onTouchEnd={stopDrawing}
            />
          </div>
          <div className="signature-toolbar">
            <span>PC: Maus / Tablet · iPad: Finger/Stift</span>
            <button type="button" className="btn-ghost" onClick={handleClear}>
              Leeren
            </button>
          </div>
        </div>
      );
    }

function isoDate() {
  return new Date().toISOString().slice(0, 10);
}

async function generateKeyProtocolPdfBlob({
  type,              // "ISSUE" | "RETURN"
  employee,
  key,
  issue,             // bei RETURN: Datensatz aus Tabelle
  comment,
  issuedSig,         // links
  receivedSig,       // rechts
}) {
  if (!window.jspdf?.jsPDF) {
    throw new Error("jsPDF ist nicht geladen. Script-Tag für jsPDF einbinden.");
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });

  const today = isoDate();

  // --- Helper: Signaturen (einheitlich) ---
  function drawSignatures(doc, leftLabel, rightLabel, leftSig, rightSig) {
    doc.setFontSize(12);
    doc.text("Unterschriften", 15, 160);

    doc.setFontSize(11);
    doc.text(leftLabel, 15, 170);
    doc.rect(15, 173, 80, 30);

    doc.text(rightLabel, 115, 170);
    doc.rect(115, 173, 80, 30);

    if (leftSig) doc.addImage(leftSig, "PNG", 16, 174, 78, 28);
    if (rightSig) doc.addImage(rightSig, "PNG", 116, 174, 78, 28);
  }

  // Titel
  doc.setFontSize(16);
  doc.text(
    type === "RETURN" ? "Schlüssel-Rückgabe Protokoll" : "Schlüssel-Ausgabe Protokoll",
    15,
    18
  );

  doc.setFontSize(11);
  doc.text(`Datum: ${today}`, 15, 28);

  // Mitarbeiter-Daten (je nach Typ)
  const empName = employee?.fullName || issue?.employeeName || "";
  const empPn   = employee?.personnelNumber || issue?.personnelNumber || "";
  const empDept = employee?.department || issue?.department || "";

  // Schlüssel-Daten (je nach Typ)
  const sys  = key?.system || issue?.system || "";
  const num  = key?.number || "";
  const desc = key?.description || "";

  // Block: Mitarbeiter
  doc.setFontSize(12);
  doc.text("Mitarbeiter", 15, 40);
  doc.setFontSize(11);
  doc.text(`Name: ${empName}`, 15, 48);
  doc.text(`Personalnr.: ${empPn}`, 15, 55);
  doc.text(`Abteilung: ${empDept}`, 15, 62);

  // Block: Schlüssel
  doc.setFontSize(12);
  doc.text("Schlüssel", 15, 75);
  doc.setFontSize(11);
  doc.text(`System: ${sys}`, 15, 83);
  if (num) doc.text(`Nummer: ${num}`, 15, 90);
  if (desc) doc.text(`Beschreibung: ${desc}`, 15, 97);

  // Block: Bemerkungen / weitere Schlüssel
  doc.setFontSize(12);
  doc.text(type === "RETURN" ? "Hinweise" : "Bemerkungen", 15, 112);
  doc.setFontSize(11);

  const text = (comment || issue?.otherKeys || "").trim() || "—";
  const lines = doc.splitTextToSize(text, 180);
  doc.text(lines, 15, 120);

  // ✅ Signaturen jetzt bei ISSUE UND RETURN möglich
  // (wenn ReturnForm keine hat, bleiben die Felder einfach leer)
  if (type === "ISSUE") {
    drawSignatures(
      doc,
      "Ausgehändigt durch",
      "Empfangen durch",
      issuedSig,
      receivedSig
    );
  } else if (type === "RETURN") {
    drawSignatures(
      doc,
      "Rückgabe bestätigt durch",
      "Rückgabe erfolgt durch",
      issuedSig,
      receivedSig
    );
  }

  return doc.output("blob");
}

async function getOrCreateIssuesJson(graphClient, folder) {
  const path = `/${folder}/issues.json`;
  const url = `/me/drive/root:${encodePath(path)}:/content`;

  try {
    const text = await graphClient.get(url, "text");
    const data = JSON.parse(text || "[]");
    return Array.isArray(data) ? data : [];
  } catch (e) {
    // Wenn Datei noch nicht existiert: erstellen
    const msg = String(e?.message || e);
    const is404 = msg.includes("404") || msg.toLowerCase().includes("itemnotfound");
    if (!is404) throw e;

    const empty = [];
    await graphClient.put(
      `/me/drive/root:${encodePath(path)}:/content`,
      new Blob([JSON.stringify(empty, null, 2)], { type: "application/json" }),
      "application/json"
    );
    return empty;
  }
}

async function saveIssuesJson(graphClient, folder, issuesArray) {
  const path = `/${folder}/issues.json`;
  await graphClient.put(
    `/me/drive/root:${encodePath(path)}:/content`,
    new Blob([JSON.stringify(issuesArray, null, 2)], { type: "application/json" }),
    "application/json"
  );
}

async function appendIssueToJson(graphClient, folder, newIssue) {
  const issues = await getOrCreateIssuesJson(graphClient, folder);
  issues.unshift(newIssue); // vorne rein
  await saveIssuesJson(graphClient, folder, issues);
  return issues;
}

async function markReturnInJson(graphClient, folder, issueId, returnFileName, extra = {}) {
  const arr = await getOrCreateIssuesJson(graphClient, folder);

  let found = false;

  const updated = (arr || []).map((x) => {
    if (String(x.id) !== String(issueId)) return x;
    found = true;

    return {
      ...x,
      hasReturn: true,
      returnDate: isoDate(),
      returnPdfFileName: returnFileName,
      returnPdfWebUrl: extra.returnPdfWebUrl || x.returnPdfWebUrl || null,
      returnIssuedSig: extra.returnIssuedSig || null,
      returnReceivedSig: extra.returnReceivedSig || null,
    };
  });

  // ✅ Wenn Eintrag nicht existiert (Excel-only), lege ihn neu an
  if (!found) {
    const base = extra.issueSnapshot || {};
    updated.unshift({
      id: String(issueId),
      employeeName: base.employeeName || "",
      personnelNumber: base.personnelNumber || "",
      department: base.department || "",
      system: base.system || "",
      otherKeys: base.otherKeys || "",
      issueDate: base.issueDate || null,

      hasReturn: true,
      returnDate: isoDate(),
      returnPdfFileName: returnFileName,
      returnPdfWebUrl: extra.returnPdfWebUrl || null,

      returnIssuedSig: extra.returnIssuedSig || null,
      returnReceivedSig: extra.returnReceivedSig || null,
    });
  }

  await saveIssuesJson(graphClient, folder, updated);
  return updated;
}

function ReturnForm({ issues, onIssuesUpdated }) {
  const [search, setSearch] = useState("");
  const [department, setDepartment] = useState("");
  const [system, setSystem] = useState("");

  // ✅ Default: To-do Liste
  const [status, setStatus] = useState("TODO"); // TODO | OPEN | ALL

  // ✅ Rückgabe-Unterschriften
  const [returnIssuedBySignature, setReturnIssuedBySignature] = useState(null);
  const [returnReceivedBySignature, setReturnReceivedBySignature] = useState(null);

  // ✅ Reset für SignaturePads
  const [sigReset, setSigReset] = useState(0);

  // ✅ aktuell ausgewählter Vorgang
  const [activeIssue, setActiveIssue] = useState(null);
  const signaturesRef = useRef(null);

  // ✅ Helfer
  const isLegacyTodo = (i) => !!i.hasReturn && !i.returnPdfWebUrl && !i.returnPdfFileName; // Altbestand ohne Rückgabe-PDF
  const isOpen = (i) => !i.hasReturn; // offen

  // ✅ To-do-Listen
  const openIssues = (issues || []).filter(isOpen);
  const legacyTodo = (issues || []).filter(isLegacyTodo);

  // ✅ Basisliste nur "bearbeitbar" (keine fertigen Rückgaben mit PDF)
  const baseList =
    status === "TODO"
      ? legacyTodo
      : status === "OPEN"
      ? openIssues
      : [...legacyTodo, ...openIssues]; // ALL = TODO + OPEN

  // ✅ Dropdown-Optionen aus aktueller Basisliste
  const departments = Array.from(
    new Set(baseList.map((i) => (i.department || "").trim()).filter(Boolean))
  );
  const systems = Array.from(new Set(baseList.map((i) => (i.system || "").trim()).filter(Boolean)));

  // ✅ Filter (Suche + Abteilung + System)
  const filtered = baseList
    .filter((i) => {
      let match = true;
      const term = (search || "").toLowerCase();

      if (term) {
        match =
          (i.employeeName || "").toLowerCase().includes(term) ||
          (i.personnelNumber || "").toLowerCase().includes(term);
      }
      if (match && department) match = (i.department || "").trim() === department;
      if (match && system) match = (i.system || "").trim() === system;

      return match;
    })
    // ✅ Sortierung: erst To-do (Altbestand), dann offen; jeweils neu -> alt
    .sort((a, b) => {
      const aLegacy = isLegacyTodo(a) ? 0 : 1;
      const bLegacy = isLegacyTodo(b) ? 0 : 1;
      if (aLegacy !== bLegacy) return aLegacy - bLegacy;

      const da = a.issueDate ? new Date(a.issueDate).getTime() : 0;
      const db = b.issueDate ? new Date(b.issueDate).getTime() : 0;
      return db - da;
    });

  const resetPads = () => {
    setReturnIssuedBySignature(null);
    setReturnReceivedBySignature(null);
    setSigReset((x) => x + 1);
  };

  const handleStart = (issue) => {
    setActiveIssue(issue);
    resetPads();
    setTimeout(() => signaturesRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }), 0);
  };

  const handleCancel = () => {
    setActiveIssue(null);
    resetPads();
  };

  const handleConfirmReturn = async () => {
    if (!activeIssue) return;

    if (!returnIssuedBySignature || !returnReceivedBySignature) {
      alert("Bitte beide Unterschriften erfassen.");
      return;
    }

    try {
      const { graphClient } = await getGraphClient();

      // 1) Rückgabe-PDF erzeugen (inkl. Signaturen)
      const pdfBlob = await generateKeyProtocolPdfBlob({
        type: "RETURN",
        issue: activeIssue,
        comment: activeIssue?.otherKeys || "",
        issuedSig: returnIssuedBySignature,
        receivedSig: returnReceivedBySignature,
      });

      // 2) Upload nach OneDrive
      const folder = "SchluesselAusgabe";
      const pn = activeIssue?.personnelNumber || "unknown";
      const fileName = `Schluessel-Rueckgabe_${pn}_${isoDate()}.pdf`;

      await uploadPdfToOneDrive({ graphClient, folder, fileName, pdfBlob });

      // 3) WebUrl
      const returnPdfWebUrl = oneDrivePdfContentUrl(folder, fileName);

      // 4) issues.json: Rückgabe markieren
      const updatedIssues = await markReturnInJson(graphClient, folder, activeIssue.id, fileName, {
        returnPdfWebUrl,
        returnIssuedSig: returnIssuedBySignature,
        returnReceivedSig: returnReceivedBySignature,
        issueSnapshot: activeIssue, // wichtig für Excel/Altbestand
      });

      if (typeof onIssuesUpdated === "function") onIssuesUpdated(updatedIssues);

      alert("✅ Rückgabe gespeichert & PDF abgelegt.");
      setActiveIssue(null);
      resetPads();
    } catch (err) {
      console.error(err);
      alert("❌ Rückgabe fehlgeschlagen: " + (err?.message || String(err)));
    }
  };

  const emptyText =
    status === "TODO"
      ? "Keine Vorgänge 'Zu protokollieren (Altbestand)' mit diesen Filtern gefunden."
      : status === "OPEN"
      ? "Keine offenen Ausgaben mit diesen Filtern gefunden."
      : "Keine bearbeitbaren Vorgänge (Altbestand + offen) mit diesen Filtern gefunden.";

  return (
    <div className="card">
      <div className="section-title">Rückgabe</div>
      <div className="section-sub">
        Hier siehst du nur bearbeitbare Vorgänge: <b>Zu protokollieren (Altbestand)</b> und <b>Offen</b>.
        Fertige Rückgaben mit Rückgabe-PDF findest du im Dashboard.
      </div>

      <div className="filters-row">
        <input
          className="input"
          placeholder="Suche nach Name oder Personalnummer…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />

        <select className="select" value={department} onChange={(e) => setDepartment(e.target.value)}>
          <option value="">Alle Abteilungen</option>
          {departments.map((d) => (
            <option key={d} value={d}>
              {d}
            </option>
          ))}
        </select>

        <select className="select" value={system} onChange={(e) => setSystem(e.target.value)}>
          <option value="">Alle Schließsysteme</option>
          {systems.map((s) => (
            <option key={s} value={s}>
              {s}
            </option>
          ))}
        </select>

        {/* ✅ Super verständlicher Status */}
        <select className="select" value={status} onChange={(e) => setStatus(e.target.value)}>
          <option value="TODO">Zu protokollieren (Altbestand)</option>
          <option value="OPEN">Offen (ausgegeben)</option>
          <option value="ALL">Alle (bearbeitbar)</option>
        </select>

        <span className="chip">
          {legacyTodo.length} zu protokollieren • {openIssues.length} offen • {filtered.length} angezeigt
        </span>
      </div>

      <div className="table-wrapper">
        {filtered.length === 0 ? (
          <div className="empty-state">{emptyText}</div>
        ) : (
          <table>
            <thead>
              <tr>
                <th>Mitarbeiter</th>
                <th>Personalnr.</th>
                <th>Abteilung</th>
                <th>Schließsystem</th>
                <th>Weitere Schlüssel</th>
                <th>Ausgabedatum</th>
                <th>Status</th>
                <th>Aktion</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((i) => {
                const legacy = isLegacyTodo(i);
                const label = legacy ? "Zu protokollieren" : "Offen";
                const btnText = legacy ? "Nachträglich protokollieren" : "Rückgabe erfassen";

                return (
                  <tr key={(legacy ? "legacy-" : "") + i.id}>
                    <td>{i.employeeName}</td>
                    <td>{i.personnelNumber || "–"}</td>
                    <td>{(i.department || "").trim()}</td>
                    <td>{i.system || "n/a"}</td>
                    <td>{i.otherKeys || "–"}</td>
                    <td>{formatDateDE(i.issueDate)}</td>
                    <td>
                      <span className="tag">{label}</span>
                    </td>
                    <td>
                      <button
                        type="button"
                        className={"btn " + (activeIssue?.id === i.id ? "btn-primary" : "")}
                        onClick={() => handleStart(i)}
                      >
                        {activeIssue?.id === i.id ? "Protokoll läuft…" : btnText}
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {activeIssue && (
        <div ref={signaturesRef} style={{ marginTop: 18 }}>
          <div className="section-title">Unterschriften</div>
          <div className="section-sub">
            Bitte beide Unterschriften erfassen. Diese werden im Rückgabe-PDF gespeichert.
          </div>

          <div className="signatures" style={{ marginTop: 12 }}>
            <SignaturePad
              key={"ret-issued-" + sigReset}
              label="Rückgabe bestätigt durch"
              role="Mitarbeiter, der den Schlüssel entgegennimmt"
              value={returnIssuedBySignature}
              onChange={setReturnIssuedBySignature}
            />
            <SignaturePad
              key={"ret-received-" + sigReset}
              label="Rückgabe erfolgt durch"
              role="Mitarbeiter, der den Schlüssel zurückgibt"
              value={returnReceivedBySignature}
              onChange={setReturnReceivedBySignature}
            />
          </div>

          <div className="footer-actions" style={{ marginTop: 12 }}>
            <button type="button" className="btn" onClick={handleCancel}>
              Abbrechen
            </button>
            <button type="button" className="btn btn-primary" onClick={handleConfirmReturn}>
              Rückgabe speichern &amp; PDF erzeugen
            </button>
          </div>
        </div>
      )}
    </div>
  );
}





function EmployeeForm({ onEmployeeCreated }) {
  const [personnelNumber, setPersonnelNumber] = useState("");
  const [fullName, setFullName] = useState("");
  const [saving, setSaving] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();

    if (!personnelNumber || !fullName) {
      alert("Bitte Personalnummer und Name eingeben.");
      return;
    }

    try {
      setSaving(true);

      const { graphClient } = await getGraphClient();

      // 🔥 In Personal.txt schreiben
   await appendEmployeeToPersonalTxt(graphClient, {
  personnelNumber: personnelNumber.trim(),
  fullName: fullName.trim(),
});


      alert("✅ Mitarbeiter wurde in Personal.txt gespeichert.");

      // Formular leeren
      setPersonnelNumber("");
      setFullName("");

      // 🔁 App neu laden lassen (Employees, Keys, Issues)
      if (typeof onEmployeeCreated === "function") {
        await onEmployeeCreated();
      }
    } catch (err) {
      console.error(err);
      alert("❌ Fehler: " + (err?.message || String(err)));
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="card">
      <div className="section-title">Mitarbeiter verwalten</div>
      <div className="section-sub">
        Neue Mitarbeiter werden direkt in <b>Personal.txt</b> in OneDrive gespeichert.
      </div>

      <form onSubmit={handleSubmit} style={{ maxWidth: 420 }}>
        <div className="form-group">
          <label className="form-label">Personalnummer</label>
          <input
            className="input"
            value={personnelNumber}
            onChange={(e) => setPersonnelNumber(e.target.value)}
            placeholder="z. B. 031046299"
          />
        </div>

        <div className="form-group">
          <label className="form-label">Vollständiger Name</label>
          <input
            className="input"
            value={fullName}
            onChange={(e) => setFullName(e.target.value)}
            placeholder="z. B. Max Mustermann"
          />
        </div>

        <button type="submit" className="btn btn-primary" disabled={saving}>
          {saving ? "Speichern…" : "Mitarbeiter anlegen"}
        </button>
      </form>
    </div>
  );
}
